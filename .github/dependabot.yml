version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Helsinki"
    groups:
      all-npm:
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
      typescript-toolchain:
        patterns:
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Helsinki"
    groups:
      all-github-actions:
        patterns:
          - "*"
